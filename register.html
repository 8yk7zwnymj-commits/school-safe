<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>สมัครสมาชิก | SCHOOL SAFE</title><link rel="icon" href="assets/school-logo.png"><link rel="stylesheet" href="style.css"><meta name="theme-color" content="#063b2a"><meta name="color-scheme" content="light"></head><body><div class="auth-page"><section class="auth-side"><img src="assets/school-logo.png" alt="ตราโรงเรียนสระแก้ว"><span class="badge badge-gold">NEW STUDENT ACCOUNT</span><h1>เริ่มจาก 0<br>แล้วพัฒนาไปด้วยกัน</h1><p>บัญชีใหม่จะเริ่มคะแนน แบบทดสอบ เกม XP และ Badge ที่ 0 ทั้งหมด</p></section><section class="auth-form-wrap"><form class="auth-box" id="registerForm"><h2>สมัครสมาชิก</h2><div class="form-row"><div class="field"><label>ชื่อเล่น</label><input id="nickname" required maxlength="30"></div><div class="field"><label>ชื่อ-นามสกุล</label><input id="fullname" required maxlength="80"></div></div><div class="form-row"><div class="field"><label>ระดับชั้น</label><select id="grade"><option>ม.1</option><option>ม.2</option><option>ม.3</option><option>ม.4</option><option>ม.5</option><option>ม.6</option></select></div><div class="field"><label>ห้อง</label><select id="room"></select></div></div><div class="form-row"><div class="field"><label>เลขที่</label><input id="number" type="number" min="1" max="60"></div><div class="field"><label>ตัวละครในเกม</label><select id="gender"><option value="female">หญิง</option><option value="male">ชาย</option></select></div></div><div class="field"><label>อีเมล</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>รหัสผ่าน</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div><button class="btn btn-primary" style="width:100%" type="submit">สร้างบัญชี →</button><div id="msg" class="form-msg"></div><p class="small muted">มีบัญชีแล้ว? <a style="color:#0c6843;font-weight:700" href="login.html">เข้าสู่ระบบ</a></p></form></section></div><script src="config.js"></script><script src="auth.js"></script><script src="register.js"></script><script src="ui.js"></script></body></html>
